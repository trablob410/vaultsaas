version: 2

project_name: valt

before:
  hooks:
    - go mod tidy

builds:
  - id: valt
    dir: valt-cli
    main: .
    binary: valt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: valt
    builds: [valt]
    name_template: "valt_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: valt-dev
    name: valt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
