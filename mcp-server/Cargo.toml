[package]
name = "valt-mcp-server"
version = "0.1.0"
edition = "2021"
description = "Valt MCP Server - Local secret vault integration for AI agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
